aid: trifacta
name: Trifacta
description: >-
  Trifacta is a data wrangling and data preparation platform that lets analysts and
  data engineers collaboratively profile, structure, clean, enrich, and pipeline data
  for analytics and machine learning. Founded in 2012 and spun out of Stanford/Berkeley
  research (backed by DCVC), Trifacta was acquired by Alteryx in early 2022 and the
  product is now marketed as Designer Cloud powered by Trifacta (and underpins Google
  Cloud Dataprep). Trifacta exposes a REST API across its product editions — Google
  Cloud Dataprep, Designer Cloud (SaaS), and self-managed Enterprise — for managing
  flows, wrangled recipes, datasets, jobs, and connections, along with a first-party
  Python SDK for automating data-preparation workflows.
